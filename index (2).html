<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>星語占卜｜星座運勢產生器</title>
  <style>
    :root {
      --bg-dark: #0b0d1e;
      --bg-card: rgba(22, 26, 56, 0.78);
      --border-glow: rgba(167, 139, 250, 0.35);
      --text-main: #f3f4f6;
      --text-muted: #a5b4fc;
      --accent-purple: #a78bfa;
      --accent-gold: #fbbf24;
      --accent-pink: #f472b6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
      color: var(--text-main);
      background:
        radial-gradient(circle at 20% 20%, rgba(124, 58, 237, 0.25), transparent 45%),
        radial-gradient(circle at 80% 30%, rgba(236, 72, 153, 0.18), transparent 45%),
        radial-gradient(circle at 50% 85%, rgba(59, 130, 246, 0.2), transparent 50%),
        var(--bg-dark);
      padding: 24px 16px 60px;
      position: relative;
      overflow-x: hidden;
    }

    /* 右上角固定顯示 40伶 */
    .top-right-badge {
      position: fixed;
      top: 16px;
      right: 20px;
      z-index: 1000;
      padding: 8px 16px;
      border-radius: 999px;
      background: rgba(30, 27, 75, 0.85);
      border: 1px solid rgba(251, 191, 36, 0.6);
      color: var(--accent-gold);
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 1px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.45), 0 0 12px rgba(251, 191, 36, 0.2);
      backdrop-filter: blur(8px);
    }

    .container {
      max-width: 720px;
      margin: 36px auto 0;
    }

    header {
      text-align: center;
      margin-bottom: 28px;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: 2px;
      background: linear-gradient(90deg, #e9d5ff, #fbbf24, #f9a8d4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.98rem;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-glow);
      border-radius: 20px;
      padding: 26px;
      backdrop-filter: blur(12px);
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.45);
      margin-bottom: 24px;
    }

    .form-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }

    .form-group {
      flex: 1 1 220px;
    }

    label {
      display: block;
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    input[type="date"] {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid rgba(167, 139, 250, 0.4);
      background: rgba(15, 18, 42, 0.9);
      color: var(--text-main);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="date"]:focus {
      border-color: var(--accent-gold);
      box-shadow: 0 0 0 3px rgba(251, 191, 36, 0.18);
    }

    button.btn-generate {
      align-self: flex-end;
      padding: 12px 24px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #8b5cf6, #ec4899);
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.2s, filter 0.2s;
      box-shadow: 0 6px 20px rgba(139, 92, 246, 0.4);
    }

    button.btn-generate:hover {
      filter: brightness(1.08);
      transform: translateY(-1px);
    }

    button.btn-generate:active {
      transform: translateY(0);
    }

    .result-card {
      display: none;
      animation: fadeIn 0.35s ease;
    }

    .result-card.show {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .zodiac-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 16px;
      margin-bottom: 18px;
      gap: 12px;
      flex-wrap: wrap;
    }

    .zodiac-title-wrap {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .zodiac-symbol {
      font-size: 2.5rem;
      width: 60px;
      height: 60px;
      display: grid;
      place-items: center;
      border-radius: 16px;
      background: rgba(167, 139, 250, 0.16);
      border: 1px solid rgba(167, 139, 250, 0.35);
    }

    .zodiac-name {
      font-size: 1.5rem;
      font-weight: 800;
    }

    .zodiac-range {
      font-size: 0.88rem;
      color: var(--text-muted);
    }

    .date-tag {
      font-size: 0.85rem;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(251, 191, 36, 0.14);
      color: var(--accent-gold);
      border: 1px solid rgba(251, 191, 36, 0.35);
    }

    .scores-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }

    .score-item {
      background: rgba(15, 18, 42, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 12px 14px;
    }

    .score-label {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .score-stars {
      color: var(--accent-gold);
      font-size: 1rem;
      letter-spacing: 2px;
    }

    .fortune-section {
      margin-bottom: 16px;
    }

    .fortune-section h3 {
      font-size: 1rem;
      color: var(--accent-purple);
      margin-bottom: 6px;
    }

    .fortune-section p {
      line-height: 1.7;
      color: #e5e7eb;
      font-size: 0.96rem;
    }

    .lucky-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 0.9rem;
    }

    .lucky-pill {
      background: rgba(244, 114, 182, 0.14);
      border: 1px solid rgba(244, 114, 182, 0.35);
      color: #fbcfe8;
      padding: 6px 14px;
      border-radius: 999px;
    }

    .error-msg {
      color: #fda4af;
      font-size: 0.88rem;
      margin-top: 10px;
      min-height: 20px;
    }
  </style>
</head>
<body>
  <!-- 右上角 40伶 -->
  <div class="top-right-badge">40伶</div>

  <div class="container">
    <header>
      <h1>✦ 星座運勢產生器 ✦</h1>
      <p>輸入你的出生年月日，探索專屬星座與今日運勢指引</p>
    </header>

    <section class="card">
      <form id="fortuneForm">
        <div class="form-row">
          <div class="form-group">
            <label for="birthDate">選擇你的生日</label>
            <input type="date" id="birthDate" required />
          </div>
          <button type="submit" class="btn-generate">產生運勢</button>
        </div>
        <div id="errorMsg" class="error-msg"></div>
      </form>
    </section>

    <section id="resultCard" class="card result-card">
      <div class="zodiac-header">
        <div class="zodiac-title-wrap">
          <div id="zodiacSymbol" class="zodiac-symbol">♈</div>
          <div>
            <div id="zodiacName" class="zodiac-name">牡羊座</div>
            <div id="zodiacRange" class="zodiac-range">3/21 - 4/19</div>
          </div>
        </div>
        <div id="todayDate" class="date-tag">今日運勢</div>
      </div>

      <div class="scores-grid">
        <div class="score-item">
          <div class="score-label">整體運勢</div>
          <div id="overallStars" class="score-stars">★★★★☆</div>
        </div>
        <div class="score-item">
          <div class="score-label">愛情運勢</div>
          <div id="loveStars" class="score-stars">★★★★☆</div>
        </div>
        <div class="score-item">
          <div class="score-label">事業學業</div>
          <div id="careerStars" class="score-stars">★★★★☆</div>
        </div>
        <div class="score-item">
          <div class="score-label">財運指數</div>
          <div id="wealthStars" class="score-stars">★★★☆☆</div>
        </div>
      </div>

      <div class="fortune-section">
        <h3>整體解析</h3>
        <p id="overallText"></p>
      </div>

      <div class="fortune-section">
        <h3>感情與人際</h3>
        <p id="loveText"></p>
      </div>

      <div class="fortune-section">
        <h3>工作與財務</h3>
        <p id="careerText"></p>
      </div>

      <div class="lucky-bar">
        <span class="lucky-pill" id="luckyColor">幸運色：紫水晶</span>
        <span class="lucky-pill" id="luckyNumber">幸運數字：7</span>
        <span class="lucky-pill" id="luckyTip">開運建議：深呼吸後再做決定</span>
      </div>
    </section>
  </div>

  <script>
    const ZODIACS = [
      { name: "摩羯座", symbol: "♑", range: "12/22 - 1/19", start: [12, 22], end: [1, 19] },
      { name: "水瓶座", symbol: "♒", range: "1/20 - 2/18", start: [1, 20], end: [2, 18] },
      { name: "雙魚座", symbol: "♓", range: "2/19 - 3/20", start: [2, 19], end: [3, 20] },
      { name: "牡羊座", symbol: "♈", range: "3/21 - 4/19", start: [3, 21], end: [4, 19] },
      { name: "金牛座", symbol: "♉", range: "4/20 - 5/20", start: [4, 20], end: [5, 20] },
      { name: "雙子座", symbol: "♊", range: "5/21 - 6/21", start: [5, 21], end: [6, 21] },
      { name: "巨蟹座", symbol: "♋", range: "6/22 - 7/22", start: [6, 22], end: [7, 22] },
      { name: "獅子座", symbol: "♌", range: "7/23 - 8/22", start: [7, 23], end: [8, 22] },
      { name: "處女座", symbol: "♍", range: "8/23 - 9/22", start: [8, 23], end: [9, 22] },
      { name: "天秤座", symbol: "♎", range: "9/23 - 10/23", start: [9, 23], end: [10, 23] },
      { name: "天蠍座", symbol: "♏", range: "10/24 - 11/22", start: [10, 24], end: [11, 22] },
      { name: "射手座", symbol: "♐", range: "11/23 - 12/21", start: [11, 23], end: [12, 21] }
    ];

    const OVERALL_POOL = [
      "今天直覺敏銳，適合整理手邊計畫與釐清優先順序。放慢腳步觀察細節，會發現意想不到的好機會。",
      "能量流動順暢，原本卡關的事情有機會出現轉機。保持開放心態，別急著替所有問題下定論。",
      "適合為自己留一點安靜的充電時間。先把核心任務完成，其餘瑣事留到狀態更好時再處理。",
      "今天容易受到周遭氛圍影響，記得守住自己的節奏。穩紮穩打的行動比一時衝動更可靠。"
    ];

    const LOVE_POOL = [
      "真誠表達感受能拉近彼此距離，有伴侶者適合一起規劃近期的小約會；單身者不妨多微笑互動。",
      "溝通時多傾聽少猜測，能避免不必要的誤會。溫柔的語氣會成為今天最有力的加分項。",
      "人際互動熱絡，可能從朋友或日常交流中獲得暖心回饋，保持自然大方最迷人。"
    ];

    const CAREER_POOL = [
      "工作或學習上適合梳理流程與核對數字，細心度會幫你避開小疏漏；財務上則以量入為出為佳。",
      "團隊合作效率不錯，適度分享想法能獲得支持；花費前多想三秒，能減少衝動購物的機率。",
      "創意點子不少，建議先記下來再逐步驗證可行性。穩健理財、避免高風險投機較為安心。"
    ];

    const COLORS = ["曜石黑", "星空紫", "暖陽金", "薄荷綠", "珊瑚粉", "深海藍", "象牙白", "琥珀橙"];
    const TIPS = [
      "喝杯溫水並伸展肩頸",
      "把今天最重要的 1 件事寫下來",
      "對幫助過你的人說聲謝謝",
      "睡前減少滑手機 30 分鐘"
    ];

    function getZodiac(month, day) {
      if (month === 12 && day >= 22) return ZODIACS[0];
      if (month === 1 && day <= 19) return ZODIACS[0];

      for (let i = 1; i < ZODIACS.length; i++) {
        const z = ZODIACS[i];
        const [sm, sd] = z.start;
        const [em, ed] = z.end;
        if ((month === sm && day >= sd) || (month === em && day <= ed)) {
          return z;
        }
      }
      return ZODIACS[0];
    }

    function hashSeed(str) {
      let h = 2166136261;
      for (let i = 0; i < str.length; i++) {
        h ^= str.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      return Math.abs(h);
    }

    function stars(count) {
      const clamped = Math.max(1, Math.min(5, count));
      return "★".repeat(clamped) + "☆".repeat(5 - clamped);
    }

    function formatToday() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, "0");
      const d = String(now.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    }

    document.getElementById("fortuneForm").addEventListener("submit", function (e) {
      e.preventDefault();
      const inputVal = document.getElementById("birthDate").value;
      const errorEl = document.getElementById("errorMsg");

      if (!inputVal) {
        errorEl.textContent = "請先選擇有效的出生日期。";
        return;
      }

      const [yearStr, monthStr, dayStr] = inputVal.split("-");
      const month = parseInt(monthStr, 10);
      const day = parseInt(dayStr, 10);

      if (!month || !day || month < 1 || month > 12 || day < 1 || day > 31) {
        errorEl.textContent = "日期格式不正確，請重新選擇。";
        return;
      }

      errorEl.textContent = "";
      const zodiac = getZodiac(month, day);
      const todayStr = formatToday();
      const seed = hashSeed(`${zodiac.name}-${todayStr}-${yearStr}`);

      const s1 = (seed % 3) + 3;          // 3 ~ 5
      const s2 = ((seed >> 3) % 3) + 3;    // 3 ~ 5
      const s3 = ((seed >> 6) % 3) + 3;    // 3 ~ 5
      const s4 = ((seed >> 9) % 4) + 2;    // 2 ~ 5

      document.getElementById("zodiacSymbol").textContent = zodiac.symbol;
      document.getElementById("zodiacName").textContent = zodiac.name;
      document.getElementById("zodiacRange").textContent = `出生區間：${zodiac.range}`;
      document.getElementById("todayDate").textContent = `今日（${todayStr}）運勢`;

      document.getElementById("overallStars").textContent = stars(s1);
      document.getElementById("loveStars").textContent = stars(s2);
      document.getElementById("careerStars").textContent = stars(s3);
      document.getElementById("wealthStars").textContent = stars(s4);

      document.getElementById("overallText").textContent = OVERALL_POOL[seed % OVERALL_POOL.length];
      document.getElementById("loveText").textContent = LOVE_POOL[(seed >> 2) % LOVE_POOL.length];
      document.getElementById("careerText").textContent = CAREER_POOL[(seed >> 4) % CAREER_POOL.length];

      const color = COLORS[seed % COLORS.length];
      const luckyNum = (seed % 9) + 1;
      const tip = TIPS[(seed >> 5) % TIPS.length];

      document.getElementById("luckyColor").textContent = `幸運色：${color}`;
      document.getElementById("luckyNumber").textContent = `幸運數字：${luckyNum}`;
      document.getElementById("luckyTip").textContent = `開運建議：${tip}`;

      document.getElementById("resultCard").classList.add("show");
    });
  </script>
</body>
</html>
